[project]
name = "lift-guard"
version = "0.1.0"
description = "Sliding-window scoring that recovers guard accuracy on domain-adapted jailbreaks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "transformers>=4.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lift_guard"]
